<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2fb" />
    <meta name="robots" content="noindex" />
    <title>진행자 · O/X 퀴즈 배틀</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="host">
    <section id="login" class="screen join" aria-labelledby="login-title">
      <div class="join-logo" aria-hidden="true"><span class="logo-o">O</span><span class="logo-x">X</span></div>
      <h1 id="login-title" class="display">진행자 입장</h1>
      <form id="login-form" class="join-form" novalidate>
        <label for="pin" class="sr-only">진행자 PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="진행자 PIN" required />
        <button type="submit" class="btn btn-primary">확인</button>
      </form>
      <p id="login-msg" class="form-msg" role="alert"></p>
    </section>

    <main id="dash" class="dash" hidden>
      <header class="dash-head">
        <h1 class="display">O/X 퀴즈 배틀 <span class="dash-sub">진행자</span></h1>
        <p id="storage" class="pill"></p>
      </header>

      <section class="panel stage-panel" aria-label="게임 화면">
        <header class="hud">
          <div class="hud-item"><span class="hud-label">라운드</span><strong id="hud-round">-</strong></div>
          <div id="timer" class="timer" hidden role="timer" aria-label="남은 시간"><span class="timer-num">0</span></div>
          <div class="hud-item hud-right"><span class="hud-label">생존</span><strong id="hud-alive">0</strong></div>
        </header>
        <div id="question" class="question-card" aria-live="polite">
          <p class="question-kicker" id="q-kicker">대기실</p>
          <p class="question-text" id="q-text">참가자 입장을 기다리는 중입니다.</p>
          <p class="question-explain" id="q-explain" hidden></p>
        </div>
        <div id="arena"></div>
        <p id="result" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="panel" aria-labelledby="ctrl-title">
        <h2 id="ctrl-title" class="panel-title">진행</h2>
        <div id="next-preview" class="next-preview"></div>
        <div class="row">
          <label for="seconds" class="field-label">제한 시간</label>
          <select id="seconds">
            <option value="5">5초</option>
            <option value="10">10초</option>
            <option value="15">15초</option>
            <option value="20">20초</option>
            <option value="30">30초</option>
            <option value="60">60초</option>
          </select>
        </div>
        <div class="btn-grid">
          <button id="ask-next" class="btn btn-primary" type="button">다음 문제 출제</button>
          <button id="reveal" class="btn btn-ink" type="button">정답 공개</button>
          <button id="to-ceremony" class="btn btn-gold" type="button">시상식 시작</button>
        </div>
        <details class="custom-q">
          <summary>직접 문제 내기</summary>
          <form id="custom-form" class="custom-form">
            <label for="custom-text" class="sr-only">문제</label>
            <textarea id="custom-text" rows="2" maxlength="120" placeholder="문제를 입력하세요"></textarea>
            <label for="custom-explain" class="sr-only">정답 설명 (선택)</label>
            <textarea id="custom-explain" rows="2" maxlength="200" placeholder="정답 설명 (선택)"></textarea>
            <fieldset class="ox-toggle">
              <legend class="field-label">정답</legend>
              <label><input type="radio" name="custom-answer" value="O" checked /><span>O</span></label>
              <label><input type="radio" name="custom-answer" value="X" /><span>X</span></label>
            </fieldset>
            <button class="btn btn-primary" type="submit">이 문제 출제</button>
          </form>
        </details>
        <div class="btn-row">
          <button id="rematch" class="btn btn-ghost" type="button">새 게임 (참가자 유지)</button>
          <button id="reset" class="btn btn-danger" type="button">전체 초기화</button>
        </div>
        <p id="ctrl-msg" class="form-msg" role="status" aria-live="polite"></p>
      </section>

      <section class="panel" aria-labelledby="prize-title">
        <h2 id="prize-title" class="panel-title">경품 등수</h2>
        <p class="hint">설정한 등수까지 시상식에서 경품이 표시됩니다. 같은 라운드에 탈락한 참가자는 같은 등수입니다.</p>
        <form id="prize-form">
          <div class="row">
            <label for="prize-count" class="field-label">경품 받는 등수</label>
            <div class="stepper">
              <button type="button" id="prize-minus" aria-label="등수 줄이기">-</button>
              <output id="prize-count" aria-live="polite">3</output>
              <button type="button" id="prize-plus" aria-label="등수 늘리기">+</button>
            </div>
          </div>
          <ol id="prize-list" class="prize-list"></ol>
          <button class="btn btn-primary" type="submit">경품 저장</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="bank-title">
        <h2 id="bank-title" class="panel-title">문제 은행</h2>
        <p class="hint">한 줄에 한 문제씩, 정답(O 또는 X) 뒤에 문제를 적으세요. 설명은 <code>//</code> 뒤에 적으면 정답 공개 때 함께 보여요(선택). 예: <code>O 문어의 심장은 3개다. // 아가미 심장 2개, 몸 심장 1개</code></p>
        <form id="bank-form">
          <label for="bank" class="sr-only">문제 목록</label>
          <textarea id="bank" rows="8"></textarea>
          <p id="bank-progress" class="hint"></p>
          <button class="btn btn-primary" type="submit">문제 저장</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="players-title">
        <h2 id="players-title" class="panel-title">참가자 <span id="player-count"></span></h2>
        <ul id="player-list" class="player-list"></ul>
      </section>
    </main>

    <section id="ceremony" class="ceremony" hidden aria-label="시상식">
    </section>
    <button id="close-ceremony" class="ceremony-close btn btn-ghost" type="button" hidden>진행 화면 보기</button>

    <script type="module" src="/host.js"></script>
  </body>
</html>
