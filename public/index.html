<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2fb" />
    <meta name="description" content="최대 30명이 함께하는 실시간 O/X 퀴즈 배틀. 마지막까지 살아남아 경품을 받으세요!" />
    <title>O/X 퀴즈 배틀</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="player">
    <section id="join" class="screen join" aria-labelledby="join-title">
      <div class="join-logo" aria-hidden="true"><span class="logo-o">O</span><span class="logo-x">X</span></div>
      <h1 id="join-title" class="display">O/X 퀴즈 배틀</h1>
      <p class="lead">닉네임을 정하고 입장하세요.<br />틀리면 탈락, 마지막 한 명이 우승!</p>
      <div id="join-preview" class="join-preview" aria-hidden="true"></div>
      <form id="join-form" class="join-form" novalidate>
        <label for="name" class="sr-only">닉네임</label>
        <input id="name" name="name" maxlength="10" autocomplete="nickname" placeholder="닉네임 (최대 10자)" required />
        <button type="submit" class="btn btn-primary">입장하기</button>
      </form>
      <p id="join-msg" class="form-msg" role="status" aria-live="polite"></p>
      <p id="join-count" class="join-count"></p>
      <button id="watch-btn" class="btn btn-ghost" type="button" hidden>관전하기</button>
    </section>

    <section id="game" class="screen game" hidden aria-label="게임 화면">
      <header class="hud">
        <div class="hud-item"><span class="hud-label">라운드</span><strong id="hud-round">-</strong></div>
        <div id="timer" class="timer" hidden role="timer" aria-label="남은 시간">
          <span class="timer-num">0</span>
        </div>
        <div class="hud-item hud-right"><span class="hud-label">생존</span><strong id="hud-alive">0</strong></div>
      </header>

      <div id="question" class="question-card" aria-live="polite">
        <p class="question-kicker" id="q-kicker">대기 중</p>
        <p class="question-text" id="q-text">진행자가 곧 게임을 시작합니다.</p>
      </div>

      <div id="arena"></div>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <div id="controls" class="controls">
        <button id="btn-o" class="choice choice-o" type="button" aria-pressed="false" aria-label="O 선택">O</button>
        <button id="btn-x" class="choice choice-x" type="button" aria-pressed="false" aria-label="X 선택">X</button>
      </div>
      <button id="leave-btn" class="link-btn" type="button">나가기</button>
    </section>

    <section id="ceremony" class="ceremony" hidden aria-label="시상식"></section>

    <script type="module" src="/player.js"></script>
  </body>
</html>
